<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ options.name }} · NMGrapher</title>
<style>body{font:16px system-ui,sans-serif;color:#26364a;background:#f5f7fb;max-width:1200px;margin:30px auto;padding:0 20px}h1{font-size:24px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:8px 14px;border:1px solid #cad4e2;border-radius:8px;background:white;color:inherit}input[type=range]{flex:1;min-width:150px}#plot{min-height:450px;border-radius:12px;overflow:hidden;background:white}p{line-height:1.5}</style>
<script>{{ plotly_source|safe }}</script><script>{{ player_source|safe }}</script></head><body>
<h1>{{ options.name }}</h1><p id="description"></p><div id="plot"></div><div class="controls"><button id="play">Play</button><button id="reset">Restart</button><button id="end">Full path</button><input id="scrub" type="range" min="0" value="0" aria-label="Trajectory frame"><label>Speed <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label><span id="time" role="status"></span></div><p id="error" role="alert"></p><p>Created in NMGrapher. This animation contains its values and runs offline. Playback interpolates time between sampled frames; no new values are generated.</p>
<script>
const report={{ trajectory|tojson }},options={{ options|tojson }},get=id=>document.getElementById(id);
get('description').textContent=report.kind==='gbm'?'GBM simulation · The dashed curve is the theoretical mean. The shaded region is a pointwise 95% probability range, not a band containing 95% of complete paths.':'Sequential states or sampled parametric coordinates, replayed in their original order.';
get('scrub').max=report.frames-1;get('speed').value=String(options.speed);
const player=new TrajectoryTools.Player('plot',report,{...options,onFrame:(k,playing)=>{get('scrub').value=k;get('play').textContent=playing?'Pause':'Play';get('time').textContent='t = '+Number(report.time[k].toPrecision(7))+' · step '+k;},onError:e=>get('error').textContent=e.message});
get('play').onclick=()=>player.playing?player.pause():player.play();get('reset').onclick=()=>player.seek(0);get('end').onclick=()=>player.seek(report.frames-1);get('scrub').oninput=e=>player.seek(e.target.value);get('speed').onchange=e=>player.options.speed=Number(e.target.value);document.addEventListener('visibilitychange',()=>{if(document.hidden)player.pause();});
</script></body></html>
